[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscope-medview"
version = "0.1.0"
description = "Cross-platform 2D/3D Medical Image Viewer (MRI, CT, X-Ray, FastMRI) with Real-Time Modular Python Analytics and Albumentations Transform Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pyqtgraph>=0.13.3",
    "PyOpenGL>=3.1.7",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.3.0",
    "polars>=1.0.0",
    "albumentations>=1.4.0",
    "opencv-python-headless>=4.8.0",
    "nibabel>=5.1.0",
    "pydicom>=2.4.0",
    "h5py>=3.10.0",
]

[project.scripts]
medview = "main:main"
